
name: Build VLC Resume for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Download VLC 3.0.24 SDK
        shell: pwsh
        run: |
          $url = "https://get.videolan.org/vlc/last/win64/vlc-3.0.24-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vlc.zip"
          Expand-Archive "$env:RUNNER_TEMP\vlc.zip" "$env:RUNNER_TEMP\vlc"
          $sdk = "$env:RUNNER_TEMP\vlc\vlc-3.0.24\sdk\include\vlc\plugins"
          if (!(Test-Path "$sdk\vlc_common.h")) {
            throw "VLC plugin headers not found"
          }
          "VLC_INCLUDE=$sdk" >> $env:GITHUB_ENV

      - name: Build plugin
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DVLC_INCLUDE_DIRS="$VLC_INCLUDE"
          cmake --build build --verbose
          ls build/*.dll

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: vlc-resume-windows-64bit
          path: build/*.dll
